{# Agent answer bubble. `answer` may contain a drafted email — rendered as-is. #}
<div class="rounded-xl border bg-white shadow-sm">
  <div class="px-4 py-2 border-b bg-slate-50 text-sm text-slate-500">You asked: <span class="text-slate-700">{{ question }}</span></div>
  <div class="px-4 py-3 text-sm text-slate-800 whitespace-pre-wrap leading-relaxed">{{ answer }}</div>
</div>
