<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DealDesk — sign in</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-slate-50 text-slate-800 flex items-center justify-center">
  <div class="w-full max-w-sm">
    <h1 class="text-center font-semibold text-2xl mb-1 tracking-tight">Deal<span class="text-indigo-600">Desk</span></h1>
    <p class="text-center text-sm text-slate-500 mb-6">Your AI CRE deal workspace.</p>
    <form method="post" action="/login" class="rounded-xl border bg-white p-6 shadow-sm space-y-3">
      {% if error %}<p class="text-sm text-rose-600">{{ error }}</p>{% endif %}
      <label class="block">
        <span class="text-sm text-slate-600">Password</span>
        <input type="password" name="password" autofocus required
               class="mt-1 w-full rounded-lg border px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </label>
      <button class="w-full rounded-lg bg-indigo-600 px-3 py-2 text-white font-medium hover:bg-indigo-700">
        Sign in
      </button>
    </form>
    <p class="text-center text-xs text-slate-400 mt-4">Set <code>DEALDESK_PASSWORD</code> in <code>.env</code>.</p>
  </div>
</body>
</html>
