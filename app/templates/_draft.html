{# Drafted email — editable, then send via SMTP (needs an inbox connected). #}
<form class="rounded-xl border bg-white shadow-sm" hx-post="/deal/{{ deal_id }}/email/send" hx-target="#emails" hx-swap="outerHTML">
  <div class="px-4 py-2 border-b bg-slate-50 text-sm text-slate-500">Draft — edit, then send</div>
  <div class="p-4 space-y-2">
    <label class="block"><span class="text-xs text-slate-500">To</span>
      <input name="to" list="deal-contacts" placeholder="name@company.com"
             class="mt-1 w-full rounded-lg border px-3 py-2 text-sm"></label>
    <datalist id="deal-contacts">{% for c in contacts %}{% if c.email %}<option value="{{ c.email }}">{{ c.name }}</option>{% endif %}{% endfor %}</datalist>
    <label class="block"><span class="text-xs text-slate-500">Subject</span>
      <input name="subject" value="{{ subject }}" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm"></label>
    <label class="block"><span class="text-xs text-slate-500">Body</span>
      <textarea name="body" rows="10" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm font-mono">{{ body }}</textarea></label>
    <div class="flex items-center gap-3">
      <button class="rounded-lg bg-indigo-600 px-4 py-2 text-white text-sm hover:bg-indigo-700">Send</button>
      <span class="text-xs text-slate-400">Sends from your connected inbox. Not connected? Copy the text and send it yourself.</span>
    </div>
    <div id="send-result"></div>
  </div>
</form>
